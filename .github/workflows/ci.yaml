name: Build

on:
  push:
    branches: [ "frigate", "v*", "rocm-*" ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          PACKAGE_NAME="migraphx-${{ steps.setup.outputs.version }}"
          PACKAGE_FILENAME="${PACKAGE_NAME}.tar.gz"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_FILENAME=$PACKAGE_FILENAME" >> $GITHUB_ENV

          docker buildx build \
            --output type=local,dest=. .

          mv out.tar.gz $PACKAGE_FILENAME
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: migraphx-${{ steps.setup.outputs.version }}
          path: |
            ${{ env.PACKAGE_FILENAME }}
          retention-days: 3

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_FILENAME }}
